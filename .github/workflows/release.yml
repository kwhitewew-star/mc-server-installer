name: Release

# Push a tag like v1.0.2: builds the Windows .exe, the portable zip and a source zip, checks that both
# builds start with a working OpenGL background, then attaches them to the GitHub release for that tag.
#
# Run it by hand (Actions → Release → Run workflow) to only build and test a branch or tag;
# tick "publish" to also upload the files to that tag's release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: true
        default: main
      publish:
        description: "Upload to the release (ref must be a tag like v1.0.2)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      REF: ${{ github.event.inputs.ref || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements-dev.txt pyinstaller

      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Check version matches tag
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          v=$(python -c "import mcsi; print(mcsi.__version__)")
          [ "v$v" = "$REF" ] || { echo "mcsi/__init__.py says $v but the tag is $REF"; exit 1; }

      - name: Build
        run: python scripts/build_exe.py

      # CI machines have no GPU, so use Mesa's software OpenGL (llvmpipe) to really exercise the 3D background.
      - name: Software OpenGL for the smoke test
        shell: bash
        run: |
          gh release download --repo pal1000/mesa-dist-win --pattern "*-release-msvc.7z" -D mesa
          7z x mesa/*.7z -omesa/x -y > /dev/null
          ls mesa/x/x64

      - name: Smoke test (single .exe and portable)
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          MCSI_SCREENSHOT_DELAY: "9000"
        run: |
          $ErrorActionPreference = "Stop"
          $fail = 0
          # single-file build
          New-Item -ItemType Directory smoke/onefile -Force | Out-Null
          Copy-Item (Get-ChildItem dist -Filter "*.exe")[0].FullName smoke/onefile/app.exe
          # portable build
          Expand-Archive (Get-ChildItem dist -Filter "*-portable.zip")[0].FullName smoke/portable -Force
          $targets = @{ "onefile" = "smoke/onefile/app.exe"; "portable" = "smoke/portable/MC-Server-Installer/MC-Server-Installer.exe" }
          foreach ($name in $targets.Keys) {
            $exe = Resolve-Path $targets[$name]
            Copy-Item mesa/x/x64/*.dll (Split-Path $exe) -Force
            $env:MCSI_SCREENSHOT = "$PWD\smoke\$name.png"
            $p = Start-Process $exe -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "::error::$name did not finish in time"; $fail++; continue }
            $report = "$PWD\smoke\$name.txt"
            if (-not (Test-Path $report)) { Write-Host "::error::$name did not start"; $fail++; continue }
            $text = Get-Content $report -Raw
            Write-Host "$name -> $text"
            if (-not $text.StartsWith("gl ok")) { Write-Host "::error::$name 3D background failed: $text"; $fail++ }
          }
          if ($fail) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ github.run_number }}
          path: |
            dist/*
            smoke/*.png
            smoke/*.txt

      - name: Publish release
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          v="${REF#v}"
          python - "$v" > notes.md <<'PY'
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(sys.argv[1])}\s*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          print((m.group(1).strip() if m else "") + """

          ### Download
          - **MC-Server-Installer-*.exe**: single file, just double-click (Windows 10/11).
          - **...-portable.zip**: unzip and run `MC-Server-Installer.exe`; starts faster.
          - **...-source.zip**: source code (needs Python 3.10+, run `run.bat`).

          Windows may show "Windows protected your PC" because the file is not code-signed:
          click **More info → Run anyway**.""")
          PY
          gh release view "$REF" >/dev/null 2>&1 || gh release create "$REF" --title "$REF" --notes-file notes.md
          gh release edit "$REF" --notes-file notes.md
          gh release upload "$REF" dist/* --clobber
