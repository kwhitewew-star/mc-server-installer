name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libfontconfig1
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pyflakes mcsi scripts tests run.py
      - run: python -m pytest -q
      - name: UI smoke test (all languages)
        if: runner.os == 'Linux'
        run: |
          for l in en ko ja zh_CN es; do python scripts/screenshots.py $l --out /tmp/shots/$l; done
